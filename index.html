body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--ink);opacity:.35;-webkit-mask-image:var(--tile);mask-image:var(--tile);-webkit-mask-size:176.4px 37.8px;mask-size:176.4px 37.8px;-webkit-mask-repeat:repeat;mask-repeat:repeat}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(20px,5vw,56px)}
header .logo{font:600 22px "Bodoni Moda",Didot,Georgia,serif;letter-spacing:.1em;text-decoration:none}
nav{display:flex;gap:28px;align-items:center;font-size:12px;font-weight:400;text-transform:uppercase;letter-spacing:.14em}
nav a{text-decoration:none;color:var(--soft)}
nav a:hover{color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
.cartbtn{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 16px}
.hero{padding:clamp(48px,10vw,120px) clamp(20px,5vw,56px) clamp(56px,9vw,100px);text-align:center}
.echo{font:500 clamp(34px,10vw,150px)/1.05 "Bodoni Moda",Didot,Georgia,serif;letter-spacing:.04em;white-space:nowrap}
.echo.e2{font-size:clamp(34px,9.5vw,126px);opacity:.45}
.echo.e3{font-size:clamp(24px,6.5vw,86px);opacity:.2}
.echo.e4{font-size:clamp(16px,4vw,52px);opacity:.08}
.hero .cta{margin-top:44px}
.cta{display:inline-block;background:var(--ink);color:var(--bg);border:0;border-radius:0;padding:15px 36px;text-decoration:none;font-weight:400;font-size:12px;text-transform:uppercase;letter-spacing:.16em}
section{padding:clamp(40px,7vw,88px) clamp(20px,5vw,56px);max-width:1240px;margin:0 auto}
h2{font:500 clamp(28px,4.6vw,46px)/1.15 "Bodoni Moda",Didot,Georgia,serif;letter-spacing:.01em;margin-bottom:12px}
.lead{color:var(--soft);max-width:52ch;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px 22px}
.item .pic{aspect-ratio:4/5;background:var(--c);border-radius:3px;display:flex;align-items:flex-end;padding:14px;font:400 12px Jost,"Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.14em;color:rgba(0,0,0,.45)}
.item h3{font-weight:400;font-size:17px;margin-top:14px}
.item .row{display:flex;justify-content:space-between;align-items:center;margin-top:4px;color:var(--soft);font-size:15px}
.item button{background:none;border:0;border-bottom:1px solid var(--soft);padding:0;font-size:14px}
.about{display:grid;gap:40px;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.about p+p{margin-top:14px}
@media(max-width:720px){.about{grid-template-columns:1fr}nav a.hide{display:none}}
form{display:flex;gap:10px;flex-wrap:wrap;max-width:460px}
input{flex:1 1 220px;font:inherit;padding:13px 16px;border:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink)}
.note{margin-top:12px;color:var(--soft);font-size:15px;min-height:1.6em}
footer{border-top:1px solid var(--line);padding:32px clamp(20px,5vw,56px);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:var(--soft);font-size:14px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg);border-left:1px solid var(--line);padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;z-index:5}
#drawer.open{transform:none}
#lines{flex:1;overflow:auto;margin:20px 0}
.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line button{background:none;border:0;color:var(--soft);font-size:14px}
.total{display:flex;justify-content:space-between;font-size:18px;margin-bottom:14px}
.x{align-self:flex-end;background:none;border:0;font-size:15px;color:var(--soft)}
@media(prefers-reduced-motion:reduce){#drawer{transition:none}html{scroll-behavior:auto}}
.lang{display:flex;gap:2px}
.lang button{background:none;border:0;border-bottom:1px solid transparent;padding:4px 7px;font-size:12px;letter-spacing:.14em;color:var(--soft)}
.lang button.on{color:var(--ink);border-bottom-color:var(--ink)}
.bar{background:#050505;color:#FAF9F8;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px clamp(16px,4vw,48px);border-bottom:1px solid #2A2830}
.bar .logo{font:600 22px "Bodoni Moda",Didot,Georgia,serif;letter-spacing:.1em;text-decoration:none;text-align:center;color:#FAF9F8}
.bar select{justify-self:start;background:#050505;color:#FAF9F8;border:1px solid #3A3742;border-radius:0;padding:6px 8px;font:inherit;font-size:12px;letter-spacing:.08em}
.bar .acts{display:flex;justify-content:flex-end;gap:20px}
.bar .acts button{background:none;border:0;border-radius:0;padding:4px 0;color:#FAF9F8;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
#searchbox{display:none;background:#050505;padding:0 clamp(16px,4vw,48px) 14px}
#searchbox.open{display:block}
#searchbox input{width:100%;background:transparent;border:0;border-bottom:1px solid #5B5764;color:#FAF9F8;padding:10px 0;font:inherit;border-radius:0}
.foot{display:block;background:#050505;color:#FAF9F8;padding:56px clamp(20px,5vw,56px) 28px;margin-top:40px;font-size:14px;border-top:0}
.foot a{color:#CFCCD6;text-decoration:none}.foot a:hover{color:#fff}
.foot .unlock{text-align:center;max-width:560px;margin:0 auto 48px}
.foot .unlock h3{font:500 clamp(22px,3.4vw,32px)/1.2 "Bodoni Moda",Didot,Georgia,serif;margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.foot .unlock p{color:#A7A4AD}
.foot form{margin:18px auto 0;justify-content:center}
.foot input{background:transparent;color:#fff;border:1px solid #4A4652}
.foot .cta{background:#FAF9F8;color:#050505}
.foot .tiny{font-size:12px;margin-top:10px;color:#8E8A97;min-height:1.4em}
.foot .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;max-width:1000px;margin:0 auto;padding-top:36px;border-top:1px solid #2A2830}
.foot h4{font:500 12px Jost,"Helvetica Neue",Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px;color:#fff}
.foot ul{padding:0}.foot li{list-style:none;margin:8px 0}
.foot .legal{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:#8E8A97;font-size:12px;border-top:1px solid #2A2830;padding-top:18px;margin-top:40px}
dialog{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:28px;max-width:380px;width:90%}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog form{display:flex;flex-direction:column;gap:12px;max-width:none;margin-top:14px}
@media(max-width:600px){.bar{grid-template-columns:1fr 1fr}.bar .logo{grid-column:1/-1;order:-1}.foot .cols{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="bar">
  <select id="langsel" aria-label="Language"><option value="cs">Čeština</option><option value="en">English</option><option value="de">Deutsch</option></select>

  <div class="acts">

  </div>
</header>
<div id="searchbox"><input id="q" type="search" data-ip="searchPh" data-ia="search" placeholder="Hledat produkty…" aria-label="Hledat"></div>

<main id="top">

    <div class="echo" aria-label="SOTTO VOCE">SOTTO VOCE</div>
    <div class="echo e2" aria-hidden="true">SOTTO VOCE</div>
    <div class="echo e3" aria-hidden="true">SOTTO VOCE</div>

</main>

<footer class="foot">

    <p data-i="unlockText"></p>
    <form id="fform"><input type="email" required data-ip="email" data-ia="email" placeholder="Tvůj e-mail" aria-label="E-mail"><button class="cta" type="submit" data-i="signUp">Odebírat</button></form>
    <p class="tiny" id="fnote" role="status"></p>
    <p class="tiny" data-i="terms"></p>
  </div>
  <div class="cols">
    <div><h4 data-i="fShop"></h4><ul><li><a href="kolekce.html" data-i="fAll"></a></li><li><a href="kolekce.html">TRACKSUITSET</a></li><li><a href="kolekce.html">TRACKPANTS</a></li><li><a href="kolekce.html">TRACKTOP</a></li></ul></div>
    <div><h4 data-i="fCommunity"></h4><ul><li><a href="#" target="_blank" rel="noopener">Instagram</a></li><li><a href="#" target="_blank" rel="noopener">TikTok</a></li><li><a href="#" target="_blank" rel="noopener">YouTube</a></li><li><a href="#" target="_blank" rel="noopener">Facebook</a></li></ul></div>
    <div><h4 data-i="fCompany"></h4><ul><li><a href="./#o-nas" data-i="fAbout"></a></li><li><a href="mailto:info@sottovoce.cz" data-i="fContact"></a></li><li><a href="#" data-i="fReturns"></a></li></ul></div>
  </div>
  <div class="legal"><span>© 2026 SOTTO VOCE</span><span><a href="#" data-i="fTerms"></a> · <a href="#" data-i="fPrivacy"></a></span></div>
</footer>
<aside id="drawer" data-ia="kosik" aria-label="Košík">
  <button class="x" id="close" data-i="close">Zavřít</button>
  <h2 style="font-size:32px" data-i="kosik">Košík</h2>
  <div id="lines"></div>
  <div class="total"><span data-i="total">Celkem</span><span id="sum">0 Kč</span></div>
  <button class="cta" id="buy" data-i="checkout">Dokončit objednávku</button>
  <p class="note" id="buynote" role="status"></p>
</aside>
<dialog id="login">
  <h2 style="font-size:32px" data-i="loginTitle"></h2>
  <form id="lform"><input type="email" required data-ip="email" placeholder="E-mail"><input type="password" required data-ip="password" placeholder="Heslo"><button class="cta" type="submit" data-i="loginBtn"></button></form>
  <p class="note" id="lnote" role="status"></p>
  <button class="x" id="lclose" data-i="close" style="margin-top:12px"></button>
</dialog>
<script>
var L={

en:{kosik:"Cart",openCart:"Open cart",view:"View the collection",aboutP1:"Sotto voce means “in a low voice”. A voice that doesn’t need to be loud to carry weight.",aboutP2:"We know the gap between how we appear and how we really feel inside. SOTTO VOCE is made for people who show calm on the surface and carry a whole world beneath it. Clothing without loud lettering, in muted colours and light fabrics.",
 email:"Your e-mail",thanks:"Thank you! This demo form does not store e-mails yet.",close:"Close",total:"Total",checkout:"Complete order",empty:"Your cart is empty. Add something from the collection.",noPay:"Payment is not connected yet. This is a demo shop.",addFirst:"Add something to your cart first.",remove:"Remove",add:"Add to cart",colH:"First collection",colLead:"Sample products. Names, prices and colours can be changed at any time.",

};
var lang="cs";try{lang=localStorage.getItem("sv-lang")||"cs"}catch(e){}
if(!L[lang])lang="cs";
function t(k){return L[lang][k]}
var cart=[];try{cart=JSON.parse(localStorage.getItem("sv-cart")||"[]")}catch(e){}
function kc(n){return n.toLocaleString(lang)+" Kč"}
function $(i){return document.getElementById(i)}
function draw(){
  try{localStorage.setItem("sv-cart",JSON.stringify(cart))}catch(e){}
  $("count").textContent=cart.length;
  var box=$("lines");
  box.innerHTML=cart.length?"":"<p class='note'>"+t("empty")+"</p>";
  var s=0;
  cart.forEach(function(x,i){
    s+=x.p;
    var l=document.createElement("div");l.className="line";
    l.innerHTML="<span>"+x.n+"<br><small>"+kc(x.p)+"</small></span><button data-r='"+i+"'>"+t("remove")+"</button>";
    box.appendChild(l);
  });
  $("sum").textContent=kc(s);
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t(e.getAttribute("data-i"))});
  document.querySelectorAll("[data-ip]").forEach(function(e){e.placeholder=t(e.getAttribute("data-ip"))});
  document.querySelectorAll("[data-ia]").forEach(function(e){e.setAttribute("aria-label",t(e.getAttribute("data-ia")))});
  $("langsel").value=lang;
  ["fnote","buynote","lnote"].forEach(function(id){$(id).textContent=""});
  if(window.buildGrid)buildGrid();
  draw();
}
$("langsel").onchange=function(){lang=this.value;try{localStorage.setItem("sv-lang",lang)}catch(x){}applyLang()};
$("lines").addEventListener("click",function(e){var r=e.target.getAttribute("data-r");if(r!==null){cart.splice(r,1);draw()}});
$("open").onclick=function(){$("drawer").classList.add("open")};
$("close").onclick=function(){$("drawer").classList.remove("open")};
$("buy").onclick=function(){$("buynote").textContent=cart.length?t("noPay"):t("addFirst")};
$("sbtn").onclick=function(){var b=$("searchbox");b.classList.toggle("open");if(b.classList.contains("open"))$("q").focus()};
$("q").addEventListener("keydown",function(e){if(e.key==="Enter")window.runSearch(this.value)});
$("q").addEventListener("input",function(){if(window.liveSearch)liveSearch(this.value)});
$("lbtn").onclick=function(){$("login").showModal()};
$("lclose").onclick=function(){$("login").close()};
$("lform").onsubmit=function(e){e.preventDefault();$("lnote").textContent=t("loginNote")};
$("fform").onsubmit=function(e){e.preventDefault();$("fnote").textContent=t("thanks");e.target.reset()};
window.runSearch=function(v){v=v.trim();if(v)location.href="kolekce.html?q="+encodeURIComponent(v)};
applyLang();
</script>
